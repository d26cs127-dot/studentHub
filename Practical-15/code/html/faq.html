<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ | StudentHub</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body><main class="max-w-[1000px] mx-auto px-6 py-10"><header class="section-header"><p class="eyebrow">HELP CENTER</p><h1>Frequently asked questions</h1></header><section class="faq-section"><div id="faq-list" class="faq-list"><p>Loading FAQs...</p></div></section></main><script>fetch('data/faqs.json').then(r=>r.json()).then(items=>{const list=document.getElementById('faq-list');list.replaceChildren();items.forEach((item,i)=>{const box=document.createElement('article');box.className='faq-item';box.innerHTML='<h3><button type="button" aria-expanded="false"></button></h3><div class="faq-answer" hidden></div>';box.querySelector('button').textContent=item.question;box.querySelector('.faq-answer').textContent=item.answer;box.querySelector('button').onclick=()=>{const open=box.querySelector('.faq-answer').hidden;box.querySelector('.faq-answer').hidden=!open;box.querySelector('button').setAttribute('aria-expanded',String(open))};list.append(box)})});</script></body></html>
